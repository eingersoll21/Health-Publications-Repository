{% extends "base.html" %}

{% block title %}Login - CHAI Health Publications Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Login</h1>
    <p class="auth-subtitle">Sign in to manage your preferences</p>

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email|default('') }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p class="auth-footer">
        Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a>
    </p>
</div>
{% endblock %}
