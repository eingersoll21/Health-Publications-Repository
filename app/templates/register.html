{% extends "base.html" %}

{% block title %}Register - Global Health Research Hub{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Sign up to receive personalized health publication digests</p>

    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ first_name|default('') }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name <span class="optional">(optional)</span></label>
            <input type="text" id="last_name" name="last_name" value="{{ last_name|default('') }}">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email|default('') }}" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
            <span class="form-hint">At least 8 characters</span>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer">
        Already have an account? <a href="{{ url_for('main.login') }}">Login here</a>
    </p>
</div>
{% endblock %}
